<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ChatGPT X — карта функций по этапам</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="img/icon-58.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; color: #1d2924; background: #e8eee9 url(img/linen-light.png); background-size: 128px; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 22px; color: #fff; background: linear-gradient(#6fcf9f, #36a774 50%, #23935f 51%, #1a7f51); border-bottom: 1px solid #0d4f33; text-shadow: 0 -1px 0 rgba(0,55,28,.65); position: sticky; top: 0; z-index: 2; }
  header img { width: 40px; height: 40px; border-radius: 9px; }
  header h1 { margin: 0; font-size: 19px; }
  header h1 small { display: block; font-size: 12px; font-weight: normal; opacity: .85; }
  header a { margin-left: auto; color: #fff; font-weight: bold; text-decoration: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 10px 18px 60px; }
  .lead { color: #3f5249; max-width: 820px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .filters button { border: 1px solid #9eaba5; border-radius: 6px; padding: 6px 11px; background: linear-gradient(#fff, #e5ebe8); font: bold 13px "Helvetica Neue", sans-serif; color: #3f4d47; cursor: pointer; }
  .filters button.on { color: #fff; background: linear-gradient(#157a49, #3fb47b); border-color: #0d4f33; }
  .filters input { flex: 1; min-width: 200px; border: 1px solid #9eaba5; border-radius: 15px; padding: 6px 12px; font-size: 14px; }
  h2 { font-size: 17px; margin: 26px 0 8px; color: #22362c; }
  h2 small { font-weight: normal; color: #6b7a72; font-size: 13px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border: 1px solid #aebbb4; border-radius: 9px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-top: 1px solid #dfe6e2; vertical-align: top; }
  th { background: linear-gradient(#f6f9f7, #e4ebe7); font-size: 12px; color: #4b5d55; border-top: 0; }
  td.id { font: 11.5px Menlo, monospace; color: #2f6a50; white-space: nowrap; }
  td.u { font-weight: bold; text-align: center; }
  .scr { display: inline-block; font-size: 11px; font-weight: bold; padding: 1px 6px; border-radius: 4px; background: #e2f1e9; color: #1d6f4a; white-space: nowrap; }
  .note { color: #a26b00; font-size: 12px; }
  .ex td { color: #5f6f67; }
</style>
</head>
<body>
<header><img src="img/icon-114.png" alt=""><h1>Карта функций ChatGPT X по этапам<small>Что из ChatGPT 1.2026.300 реализуемо на iPhone 5 / iOS 6, в каком порядке и где это в интерфейсе</small></h1><a href="index.html">← Прототип</a></header>
<main>
  <p class="lead" id="lead"></p>
  <div class="filters" id="filters"></div>
  <div id="out"></div>
</main>
<script src="js/features.js"></script>
<script>
  var D = window.FEATURES, F = D.included, X = D.excluded, scr = D.screens, sel = 0, q = '';
  document.getElementById('lead').innerHTML = 'Из <b>' + D.total + '</b> сценариев карты взяты <b>' + F.length + '</b> с пользой 6–10, у которых есть интерфейс на iOS 6 и понятный объём работ. Этап функции = её польза: сначала 10/10, потом 9, 8, 7, 6. ' +
    '<b>' + X.length + '</b> полезных сценариев отложены (нет системного API в iOS 6 или нужно сначала исследование), <b>' + D.lowUsefulness + '</b> с пользой ниже 6 в дизайн не входят. Оценки пользы и размера — редакторские, из исследования; они не означают, что маршруты сервиса уже проверены.';
  var fl = document.getElementById('filters');
  ['Все этапы', '10', '9', '8', '7', '6', 'Отложено'].forEach(function (t, i) {
    var b = document.createElement('button'); b.textContent = t; if (!i) b.className = 'on';
    b.onclick = function () { sel = i; fl.querySelectorAll('button').forEach(function (x, k) { x.classList.toggle('on', k === i); }); draw(); };
    fl.appendChild(b);
  });
  var inp = document.createElement('input'); inp.placeholder = 'Поиск по названию, id или месту в UI'; inp.oninput = function () { q = inp.value.toLowerCase(); draw(); }; fl.appendChild(inp);
  function match(f) { return !q || (f.t + ' ' + f.id + ' ' + (f.p || '') + ' ' + (f.why || '')).toLowerCase().indexOf(q) >= 0; }
  function draw() {
    var out = '', stages = [10, 9, 8, 7, 6];
    if (sel !== 6) stages.forEach(function (u, i) {
      if (sel && sel !== i + 1) return;
      var list = F.filter(function (f) { return f.u === u && match(f); });
      if (!list.length) return;
      out += '<h2>Этап ' + u + '/10 <small>' + list.length + ' функций · всего к этому этапу ' + F.filter(function (f) { return f.u >= u; }).length + '</small></h2><table><tr><th>Функция</th><th>Размер</th><th>Экран</th><th>Где в интерфейсе</th><th>id</th></tr>';
      list.forEach(function (f) { out += '<tr><td><b>' + f.t + '</b><br><span style="color:#6b7a72">' + f.s + '</span>' + (f.note ? '<br><span class="note">' + f.note + '</span>' : '') + '</td><td class="u">' + f.c + '</td><td><span class="scr">' + scr[f.scr] + '</span></td><td>' + f.p + '</td><td class="id">' + f.id + '</td></tr>'; });
      out += '</table>';
    });
    if (!sel || sel === 6) {
      var ex = X.filter(match);
      if (ex.length) {
        out += '<h2>Отложено <small>польза ≥ 6, но сейчас не входит в дизайн</small></h2><table><tr><th>Функция</th><th>Польза</th><th>Причина</th><th>id</th></tr>';
        ex.forEach(function (f) { out += '<tr class="ex"><td><b>' + f.t + '</b><br>' + f.s + '</td><td class="u">' + f.u + '</td><td>' + f.why + '</td><td class="id">' + f.id + '</td></tr>'; });
        out += '</table>';
      }
    }
    document.getElementById('out').innerHTML = out || '<p>Ничего не найдено.</p>';
  }
  draw();
</script>
</body>
</html>
